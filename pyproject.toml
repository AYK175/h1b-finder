[project]
name = "h1b-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "fastexcel>=0.12",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "anthropic>=0.40",
    "streamlit>=1.38",
]

[project.scripts]
h1b = "h1b_finder.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h1b_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
